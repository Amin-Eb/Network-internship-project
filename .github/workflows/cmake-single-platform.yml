name: CMake Tests

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master, develop, feature/* ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build-type: [Debug, Release]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: debuging action
      run: |
        pwd
        ls
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgtest-dev \
          libpcap-dev \
          git \
          wget \
          libssl-dev \
          libpcre3-dev \
          g++ 
    - name: Install
      run: |
        cd P2
        ls
        chmod +x install-Vactions.sh
        ./install-Vactions.sh
    - name: Run tests
      run: |
        cd P2
        cd build
        ctest --verbose --output-on-failure
      
    - name: Test with valgrind (optional)
      run: |
        sudo apt-get install -y valgrind
        cd build
        for test in *-tests; do
          if [ -f "$test" ] && [ -x "$test" ]; then
            echo "Running valgrind on $test"
            valgrind --leak-check=full --error-exitcode=1 ./$test || true
          fi
        done
