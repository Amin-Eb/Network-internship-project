name: CMake Tests

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master, develop, feature/* ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build-type: [Debug, Release]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: configure nDPI
      run: |
        sudo apt-get install -y build-essential git gettext flex bison libtool autoconf automake pkg-config libpcap-dev libjson-c-dev libnuma-dev libpcre2-dev libmaxminddb-dev librrd-dev
        git clone https://github.com/ntop/nDPI.git
        cd nDPI
        ./autogen.sh
        ./configure --prefix=/usr/local/  # Explicitly set prefix
        make
        sudo make install
        sudo ldconfig
    - name: Install system dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgtest-dev \
            libpcap-dev \
            git \
            wget \
            libssl-dev \
            libpcre3-dev \
            g++ 
    - name: Install
      run: |
        cd P2
        ls
        ls /usr/local/include/
        chmod +x install_Vactions.sh
        ./install_Vactions.sh
    - name: Run tests
      run: |
        cd P2
        cd build
        ctest --verbose --output-on-failure
      
    - name: Test with valgrind (optional)
      run: |
        sudo apt-get install -y valgrind
        cd P2/build
        for test in *-tests; do
          if [ -f "$test" ] && [ -x "$test" ]; then
            echo "Running valgrind on $test"
            valgrind --leak-check=full --error-exitcode=1 ./$test || true
          fi
        done
